<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>印相 · 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #231F20;
    --terra: #BB4430;
    --teal: #7EBDC2;
    --sand: #F3DFA2;
    --paper: #F4F6F8;
    --paper-2: #E7EAEF;
    --muted: rgba(28, 28, 30, 0.48);
    --card: #FFFFFF;
    --white: #FFFFFF;
    --line: rgba(35, 31, 32, 0.12);
    --strength: 64;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    background: var(--paper);
    font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  img { max-width: 100%; }

  .bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 10px 18px;
    background: var(--paper);
    color: var(--ink);
    border-bottom: 1px solid var(--line);
  }
  .logo {
    font-weight: 700;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }
  .logo small {
    font-weight: 500;
    letter-spacing: 0;
    color: rgba(35, 31, 32, 0.55);
    margin-left: 8px;
  }
  .seg { display: flex; padding: 3px; background: var(--paper-2); border-radius: 999px; }
  .seg button, .modes button, .toggle button {
    border: 0;
    background: transparent;
    border-radius: 999px;
    padding: 6px 14px;
  }
  .seg button.on { background: var(--ink); color: var(--paper); font-weight: 650; }
  .modes button.on, .toggle button.on { background: var(--terra); color: var(--paper); }
  .hint { margin-left: auto; font-size: 12px; color: rgba(35, 31, 32, 0.55); }

  .stage { position: relative; z-index: 1; min-height: calc(100vh - 52px); }
  .app-stage {
    display: grid;
    place-items: center;
    padding: 18px 16px 28px;
  }
  .phone {
    width: 390px;
    height: min(820px, calc(100vh - 88px));
    background: var(--paper);
    color: var(--ink);
    border: 0;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }
  .status {
    height: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 18px;
    font-size: 12px;
    font-weight: 600;
  }
  .screen {
    flex: 1; overflow: auto; min-height: 0; padding: 0 16px 16px;
    background: var(--paper);
    color: var(--ink);
  }
  .tabbar {
    height: 64px;
    margin: 0 14px 12px;
    display: grid;
    grid-template-columns: 1fr 1fr auto 1fr 1fr;
    align-items: center;
    border-top: 0;
    border-radius: 34px;
    background: #1C1C1E;
    box-shadow: 0 14px 32px rgba(20, 20, 24, 0.16);
    padding: 0 4px;
    position: relative;
    z-index: 8;
  }
  .tabbar .tab {
    border: 0;
    background: transparent;
    height: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 10px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.46);
  }
  .tabbar .tab.on { color: white; font-weight: 650; }
  .tabbar svg { display: block; }
  .tab-main {
    width: 64px;
    border: 0;
    background: transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    margin-top: -20px;
    color: white;
    font-size: 10px;
    font-weight: 600;
  }
  .plus {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--teal);
    color: var(--ink);
    display: grid;
    place-items: center;
    font-size: 30px;
    line-height: 1;
    font-weight: 400;
  }
  .tab-main.on .plus { box-shadow: inset 0 0 0 2px var(--paper), 0 0 0 2px var(--teal); }
  .feed {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: 10px;
    row-gap: 18px;
    align-items: start;
  }
  .feed-card {
    min-width: 0;
    background: transparent;
    color: var(--ink);
    padding: 0;
    border-radius: 0;
    box-shadow: none;
  }
  .feed-shot {
    display: block;
    width: 100%;
    aspect-ratio: 3 / 4;
    border: 0;
    padding: 0;
    border-radius: 20px;
    overflow: hidden;
    background: #E7EAEF;
    position: relative;
  }
  .feed-shot > img,
  .feed-shot .swatch,
  .feed-shot .grade {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;
  }
  .feed-shot .grade img.base {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    object-fit: cover;
  }
  .feed-name {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 10px 2px 8px;
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.3;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
  }
  .feed-name span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .feed-go {
    width: 100%;
    height: 34px;
    border: 0;
    border-radius: 999px;
    background: var(--terra);
    color: white;
    font-size: 13px;
    font-weight: 650;
  }
  .grade { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .grade img.base { width: 100%; height: 100%; object-fit: cover; object-position: 22% center; display: block; }
  .same-lock { height: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 14px; background: #E6E6E8; }
  .same-lock img, .same-lock .swatch, .same-lock .grade { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; }
  .score-tile { border: 0; text-align: left; display: block; width: 100%; }
  .score-n {
    margin: 10px 4px 0;
    min-height: 26px;
    font-family: Fraunces, Georgia, "Songti SC", serif;
    font-size: 26px;
    font-weight: 650;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--terra);
  }
  .score-v {
    margin: 4px 2px 0;
    height: 2.8em;
    font-size: 12px;
    line-height: 1.4;
    color: rgba(22, 22, 22, 0.72);
    overflow: hidden;
  }
  .score-photo { height: 220px; border-radius: 22px; overflow: hidden; background: #E6E6E8; }
  .score-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 22%; display: block; }
  .score-head { display: flex; gap: 12px; align-items: center; margin: 12px 2px; }
  .score-head b { font-family: Fraunces, Georgia, "Songti SC", serif; font-size: 34px; font-weight: 650; letter-spacing: -0.045em; line-height: 1; color: var(--terra); }
  .score-mine b { color: var(--terra); }
  .score-head p { margin: 0; font-size: 14px; line-height: 1.4; }
  .score-bars { padding: 4px 12px; margin-top: 0; }
  .score-mine {
    width: 100%; display: flex; gap: 12px; align-items: center;
    border: 0; background: transparent; text-align: left; padding: 10px 12px;
  }
  .score-mine img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; flex: none; }
  .score-mine b { display: block; font-size: 22px; line-height: 1; }
  .score-mine em { display: block; margin-top: 4px; font-style: normal; font-size: 13px; line-height: 1.35; color: rgba(22, 22, 22, 0.68); }
  .grid-style .shot { aspect-ratio: 3/4; }
  .frow {
    width: 100%;
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 10px 12px;
    border: 0;
    background: transparent;
    text-align: left;
    border-bottom: 1px solid var(--line);
  }
  .frow .thumb { width: 48px; height: 48px; border-radius: 8px; overflow: hidden; flex: none; }
  .frow strong { display: block; font-size: 15px; font-weight: 600; }
  .frow em { display: block; margin-top: 2px; font-style: normal; font-size: 12px; color: rgba(22, 22, 22, 0.5); }
  .group .frow:last-child { border-bottom: 0; }
  .nav {
    position: sticky;
    top: 0;
    z-index: 3;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 8px;
    height: auto;
    margin: 0 -16px 14px;
    padding: 12px 16px 8px;
    background: var(--paper);
  }
  .nav-title {
    margin: 0;
    min-width: 0;
    text-align: left;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.05;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .nav-back, .nav-side {
    border: 0;
    background: transparent;
    flex: none;
    min-height: 44px;
    text-align: left;
    padding: 0 8px 0 0;
    font-size: 15px;
    color: var(--ink);
  }
  .flist { display: flex; flex-direction: column; gap: 10px; }
  .fban {
    position: relative;
    aspect-ratio: 3.2 / 1;
    height: auto;
    border-radius: 20px;
    overflow: hidden;
    background: var(--ink);
    color: white;
  }
  .tone-teal, .tone-sand, .tone-terra { color: var(--paper); }
  .fban-main {
    position: absolute;
    inset: 0;
    display: block;
    border: 0;
    padding: 0;
    background: transparent;
    color: inherit;
    text-align: left;
  }
  .fban-copy {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    min-width: 0;
    width: 52%;
    padding: 12px 4px 28px 14px;
  }
  .fban-copy strong {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .fban-copy span {
    margin-top: 2px;
    font-size: 12px;
    line-height: 1.3;
    opacity: 0.82;
    display: -webkit-box;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .fban-visual { position: absolute; inset: 0; }
  .fban-visual .grade { position: absolute; inset: 0; }
  .fban-visual .grade img.base { width: 100%; height: 100%; object-fit: cover; object-position: center center; }
  .fban-visual::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, rgba(20, 20, 24, 0.72) 0%, rgba(20, 20, 24, 0.18) 42%, transparent 64%);
    pointer-events: none;
  }
  .fban-foot {
    position: absolute;
    left: 14px;
    bottom: 10px;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 12px;
    pointer-events: none;
  }
  .fban-foot b {
    font-size: 15px;
    font-weight: 650;
    letter-spacing: -0.03em;
    line-height: 1;
  }
  .fban-foot button {
    pointer-events: auto;
    border: 0;
    background: transparent;
    padding: 0;
    font-size: 13px;
    font-weight: 650;
  }
  .zone { margin: 4px 0 18px; }
  .zone-head { display: flex; align-items: baseline; justify-content: space-between; margin: 0 2px 8px; }
  .zone-head h2 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; letter-spacing: -0.03em; color: var(--ink); }
  .mark {
    width: 28px; height: 28px; border-radius: 9px;
    display: inline-grid; place-items: center; flex: none; color: var(--ink);
  }
  .mark svg { width: 16px; height: 16px; display: block; }
  .mark.sm { width: 22px; height: 22px; border-radius: 7px; }
  .mark.sm svg { width: 13px; height: 13px; }
  .mark.sand { background: var(--sand); color: var(--terra); }
  .mark.teal { background: var(--teal); color: var(--ink); }
  .mark.terra { background: var(--terra); color: white; }
  .mark.ink { background: var(--ink); color: var(--sand); }
  .score-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .score-act {
    display: flex; align-items: center; gap: 8px;
    border: 0; background: white; color: var(--ink);
    border-radius: 16px; padding: 10px 12px;
    box-shadow: 0 8px 22px rgba(28, 32, 48, 0.06);
    font-size: 14px; font-weight: 650; text-align: left;
  }
  .pile { display: flex; flex-direction: column; }
  .pile-back {
    display: flex; align-items: center; gap: 8px;
    height: 62px; border: 0; border-radius: 16px;
    margin: 0 16px -24px; padding: 0 12px 22px;
    text-align: left; position: relative; color: var(--ink);
  }
  .pile-back:nth-child(1) { z-index: 1; background: var(--sand); margin-left: 26px; margin-right: 26px; }
  .pile-back:nth-child(2) { z-index: 2; background: var(--teal); margin-left: 12px; margin-right: 12px; }
  .pile-back em { font-style: normal; font-size: 13px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pile-back b { margin-left: auto; font-family: Fraunces, Georgia, "Songti SC", serif; font-size: 18px; font-weight: 650; letter-spacing: -0.04em; }
  .pile-front {
    z-index: 3; position: relative;
    display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center;
    border: 0; background: white; color: var(--ink);
    border-radius: 22px; padding: 12px; text-align: left;
    box-shadow: 0 14px 32px rgba(28, 32, 48, 0.08);
  }
  .pile-front img { width: 96px; height: 124px; object-fit: cover; border-radius: 14px; }
  .pile-front small { display: block; font-size: 11px; letter-spacing: 0.08em; color: var(--muted); }
  .pile-front b { display: block; margin-top: 2px; font-family: Fraunces, Georgia, "Songti SC", serif; font-size: 32px; font-weight: 650; letter-spacing: -0.045em; line-height: 1; color: var(--terra); }
  .pile-front p { margin: 6px 0 0; font-size: 13px; line-height: 1.4; color: rgba(28, 28, 30, 0.72); }
  .upload-lead { margin: 2px 2px 14px; font-size: 14px; line-height: 1.45; color: rgba(28, 28, 30, 0.68); }
  .album { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .album-shot {
    display: block; width: 100%; aspect-ratio: 3 / 4;
    border: 0; padding: 0; border-radius: 16px; overflow: hidden; background: #E7EAEF;
  }
  .album-shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pick-list { display: flex; flex-direction: column; gap: 10px; }
  .pick-photo {
    display: flex; align-items: center; gap: 12px;
    border: 0; background: white; color: var(--ink);
    border-radius: 18px; padding: 8px;
    box-shadow: 0 8px 22px rgba(28, 32, 48, 0.06);
    text-align: left;
  }
  .pick-photo img { width: 64px; height: 80px; object-fit: cover; border-radius: 12px; flex: none; }
  .pick-photo strong { display: block; font-size: 15px; }
  .pick-photo em { display: block; margin-top: 2px; font-style: normal; font-size: 12px; color: var(--muted); }
  .pick-photo > span { flex: 1; min-width: 0; }
  .pick-photo .mark { flex: none; margin-left: auto; }
  .tip-card {
    display: flex; gap: 10px; align-items: flex-start;
    border-radius: 18px; padding: 14px; margin-bottom: 10px; color: var(--ink);
  }
  .tip-card strong { display: block; font-size: 15px; }
  .tip-card p { margin: 4px 0 0; font-size: 13px; line-height: 1.4; }
  .tip-card.sand { background: var(--sand); }
  .tip-card.teal { background: var(--teal); }
  .tip-card.terra { background: var(--terra); color: white; }
  .tip-card.ink { background: var(--ink); color: white; }
  .tip-card .mark { background: white; color: var(--ink); }
  .zone-head p { margin: 2px 0 0; font-size: 12px; color: rgba(35, 31, 32, 0.55); }
  .text-btn { border: 0; background: transparent; color: var(--terra); font-size: 15px; min-height: 44px; padding: 0 2px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 10px; }
  .rcard { border: 0; background: transparent; padding: 0; text-align: left; }
  .shot { position: relative; aspect-ratio: 1/1; border-radius: 20px; overflow: hidden; background: #E7EAEF; }
  .shot img, .shot .swatch { width: 100%; height: 100%; object-fit: cover; }
  .rcard strong { display: block; margin-top: 6px; font-size: 13px; font-weight: 600; }
  .hintline { margin: 4px 2px 12px; font-size: 13px; line-height: 1.4; color: rgba(35, 31, 32, 0.68); }
  .group { background: var(--card); color: var(--ink); border-radius: 22px; overflow: hidden; margin-top: 12px; box-shadow: 0 10px 28px rgba(28, 32, 48, 0.06); }
  .group .list-btn { padding: 13px 14px; }
  .group .list-btn:last-child { border-bottom: 0; }
  .profile { display: flex; gap: 12px; align-items: center; padding: 4px 2px 2px; }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: var(--teal); color: var(--ink);
    display: grid; place-items: center; font-weight: 600;
  }
  .profile p { margin: 2px 0 0; font-size: 13px; color: rgba(35, 31, 32, 0.62); }
  .empty { margin: 0; padding: 12px 14px; font-size: 13px; color: rgba(22, 22, 22, 0.45); }
  .detail-shot { height: 228px; aspect-ratio: auto; margin-bottom: 12px; }
  .dock { margin-top: 8px; }

  .eyebrow {
    margin: 0 0 8px;
    font-family: "Archivo Black", "PingFang SC", sans-serif;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--terra);
  }
  h1.display {
    margin: 0;
    font-size: 40px;
    line-height: 0.92;
    letter-spacing: -0.045em;
    font-weight: 700;
  }
  .lead { margin: 12px 0 0; font-size: 14px; color: rgba(35, 31, 32, 0.72); }
  .duo { display: flex; gap: 8px; margin-top: 18px; }
  .ink {
    flex: 1;
    border: 0;
    border-radius: 999px;
    padding: 12px 10px;
    font-weight: 650;
  }
  .ink.blue { background: var(--teal); color: var(--ink); }
  .ink.orange { background: var(--sand); color: var(--ink); }
  .ink.ghost { background: transparent; border: 1px solid rgba(22, 22, 22, 0.2); }
  .mark.ink { flex: none; width: 28px; height: 28px; padding: 0; border-radius: 9px; }
  .mark.sm.ink { width: 22px; height: 22px; border-radius: 7px; }
  .section-label {
    margin: 22px 0 10px;
    font-size: 12px;
    letter-spacing: 0.08em;
    font-weight: 650;
  }
  .rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
  .tcard {
    width: 132px;
    flex: none;
    border: 0;
    padding: 0;
    background: transparent;
    text-align: left;
  }
  .art {
    height: 176px;
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    background: var(--sand);
  }
  .art img, .swatch, .hero-art img, .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  img.hide-notes { object-position: center top; transform: scale(1.38); transform-origin: center top; }
  .swatch { position: relative; }
  .swatch span {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0;
    line-height: 1;
  }
  .sun {
    color: var(--ink);
    background:
      radial-gradient(circle at 72% 30%, rgba(255,255,255,.75) 0 14%, transparent 15%),
      linear-gradient(165deg, var(--sand), #E7C56A 58%, #C4A15A);
  }
  .plain {
    color: var(--ink);
    background:
      linear-gradient(#C9C1B4, #C9C1B4) 14px 22% / 62% 1px no-repeat,
      linear-gradient(#C9C1B4, #C9C1B4) 14px 32% / 40% 1px no-repeat,
      #E7E1D6;
  }
  .comic {
    color: var(--ink);
    background:
      repeating-linear-gradient(-18deg, transparent 0 10px, rgba(35,31,32,.18) 10px 11px),
      var(--teal);
  }
  .pill {
    position: absolute;
    top: 8px;
    left: 8px;
    background: var(--paper);
    border-radius: 999px;
    font-size: 10px;
    padding: 3px 7px;
    font-weight: 650;
  }
  .tcard strong { display: block; margin-top: 8px; font-size: 13px; }
  .tcard em { display: block; margin-top: 2px; font-style: normal; font-size: 11px; color: rgba(22, 22, 22, 0.55); }

  .back {
    border: 0;
    background: transparent;
    padding: 0 0 8px;
    font-size: 13px;
    color: rgba(35, 31, 32, 0.62);
  }
  .hero-art { height: 280px; border-radius: 18px; overflow: hidden; position: relative; background: var(--sand); }
  .hero-art img { width: 100%; height: 100%; object-fit: cover; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .chip {
    border: 0;
    border-radius: 999px;
    padding: 5px 9px;
    font-size: 12px;
    background: #E7F3F4;
    color: var(--ink);
  }
  .btn {
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 14px 16px;
    font-weight: 650;
    background: var(--terra);
    color: var(--paper);
  }

  .pick {

  .site { position: relative; z-index: 1; }
  .hero {

    top: -6vw;

  .kicker {

  }
  .split { display: grid; grid-template-columns: 1fr 1fr; min-height: 460px; }
  .pane { padding: 36px 7vw; color: #1a1208; }

  .pane.blue { background: var(--teal); color: var(--ink); }

  .wall, .band { padding: 42px 7vw 56px; position: relative; z-index: 1; }

  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 18px; }
  .poster-tile {
    border: 0;

  }

  .score-layout { display: grid; grid-template-columns: 280px 1fr; gap: 28px; align-items: center; }
  .score-card {
    background: white;
    color: var(--ink);

  }
  .score-card img { height: 220px; width: 100%; object-fit: cover; display: block; }

  .prices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }

    color: var(--ink);
  }
  .price.member { background: var(--terra); color: var(--paper); }

  .gtoast {
    position: fixed;
    z-index: 40;

  @media (max-width: 860px) {
    .hint { display: none; }
    .hero, .split, .grid3, .score-layout, .prices { grid-template-columns: 1fr; }
    .hero { min-height: auto; align-items: start; }
    .hero::after { width: 220px; height: 220px; }
    .poster-tile .art { height: 240px; }
    .phone { width: 100%; height: calc(100vh - 70px); border-radius: 0; border: 0; }
    .status { display: none; }

  }
  @media (prefers-reduced-motion: reduce) {

  /* App */
  .phone {

  .phone .screen::-webkit-scrollbar { display: none; }
  .t-sand { background: var(--sand); color: var(--ink); }
  .t-teal { background: var(--teal); color: var(--ink); }
  .t-cream { background: var(--cream); color: var(--ink); }

    : `<h3>示例原片</h3>${SRCS.map((s) => pickRow(s, "pick-src", "相册")).join("")}`;
  return `<div class="sheet-scrim" data-act="close-sheet"></div><div class="sheet">${body}</div>`;
}

function clearToast() {
  state.toast = "";
  const g = document.getElementById("gtoast");

}

function icon(name) {
  const paths = {
    style: '<rect x="4" y="3.5" width="16" height="17" rx="2"/><path d="M8 9h8M8 13h5"/>',

  return `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7">${paths[name]}</svg>`;
}
function tabs() {

  return item("style", "模版", "style-tab") + item("filter", "滤镜")

    + item("score", "评分") + item("me", "我的");
}
function screen() {
  if (state.view === "detail") return detail();
  if (state.view === "pay") return pay();
  if (state.view === "create") return create();
  if (state.tab === "filter") return filters();
  if (state.tab === "score") return score();
  if (state.tab === "me") return me();

}
function phone() {

}

}

function hint() {
  if (state.surface === "web") return "网站保留海报语气。应用里改成工具结构。";
  if (state.view === "create" && state.locked) return "拍同款只差自己的照片。";
  if (state.tab === "score") return "最新一张摊开，其余叠在后面。";
  if (state.tab === "filter") return "色块卡片，右边是同一张街景的调色。";
  if (state.tab === "me") return "资料、数据和按类型分开的配方。";
  return "上新放大，其余双列，拍同款跟在名字旁边。";
}

function render() {
  document.getElementById("hint").textContent = hint();
  document.getElementById("stage").innerHTML = state.surface === "web" ? web() : phone();
  document.querySelectorAll(".seg button").forEach((b) => b.classList.toggle("on", b.dataset.surface === state.surface));
  document.documentElement.style.setProperty("--strength", String(state.strength));
  let g = document.getElementById("gtoast");
  if (!g) {
    g = document.createElement("div");
    g.id = "gtoast";
    g.className = "gtoast";
    document.body.appendChild(g);
  }
  g.textContent = state.toast;
  g.hidden = !state.toast;
  setupRail();
}

let railDragged = false;
const railGeo = new WeakMap();
function railMeasure(rail) {
  const cards = [...rail.children];
  const geo = { cards, mids: cards.map((c) => c.offsetLeft + c.offsetWidth / 2), w: cards[0] ? cards[0].offsetWidth : 1, half: rail.clientWidth / 2 };
  railGeo.set(rail, geo);
  return geo;
}
function railIndex(rail) {
  const g = railGeo.get(rail) || railMeasure(rail);
  const mid = rail.scrollLeft + g.half;
  let best = 0;
  g.mids.forEach((m, i) => { if (Math.abs(m - mid) < Math.abs(g.mids[best] - mid)) best = i; });
  return best;
}
function railCenter(rail) {
  const g = railGeo.get(rail) || railMeasure(rail);
  return g.cards[railIndex(rail)] || null;
}
function railTo(rail, card, smooth) {
  const left = card.offsetLeft - (rail.clientWidth - card.offsetWidth) / 2;
  rail.scrollTo({ left, behavior: smooth ? "smooth" : "auto" });
}
function railPaint(rail) {
  const g = railGeo.get(rail) || railMeasure(rail);
  const mid = rail.scrollLeft + g.half;
  g.cards.forEach((c, i) => {
    const d = (g.mids[i] - mid) / g.w;
    const k = Math.max(-2, Math.min(2, d));
    c.style.transform = `translate(${-k * 4}%, ${Math.abs(k) * 22}px) rotate(${k * 7}deg)`;
    c.style.zIndex = String(10 - Math.round(Math.abs(d) * 3));
  });
  const ci = railIndex(rail);
  if (g.last === ci) return;
  g.last = ci;
  document.querySelectorAll(".v-dots i").forEach((dot, i) => dot.classList.toggle("on", i + 1 === ci));
  const center = g.cards[ci];
  if (center && center.dataset.act === "score-card") state.scoreId = center.dataset.id;
}
function setupRail() {
  const rail = document.querySelector(".v-rail");
  if (!rail) return;
  railMeasure(rail);
  const start = [...rail.children].find((c) => c.dataset.id === (state.scoreId || SCORE_ORDER[0]));
  if (start) railTo(rail, start, false);
  railPaint(rail);
  let queued = false;
  rail.addEventListener("scroll", () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; railPaint(rail); });
  }, { passive: true });
  rail.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "mouse") return;
    railDrag = { rail, x0: e.clientX, s0: rail.scrollLeft };
    railDragged = false;
  });
}
let railDrag = null;
window.addEventListener("resize", () => {
  const rail = document.querySelector(".v-rail");
  if (rail) { railMeasure(rail); railPaint(rail); }
});
window.addEventListener("pointermove", (e) => {
  if (!railDrag) return;
  const dx = e.clientX - railDrag.x0;
  if (Math.abs(dx) > 5 && !railDragged) {
    railDragged = true;
    railDrag.rail.classList.add("drag");
  }
  if (railDragged) railDrag.rail.scrollLeft = railDrag.s0 - dx;
});
window.addEventListener("pointerup", () => {
  if (!railDrag) return;
  const rail = railDrag.rail;
  railDrag = null;
  if (!railDragged) return;
  rail.classList.remove("drag");
  const c = railCenter(rail);
  if (c) railTo(rail, c, true);
  setTimeout(() => { railDragged = false; }, 0);
});

document.body.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "noop") {
    state.toast = "正式版这里会打开说明。演示先留在这一页。";
    arm(1800, () => { clearToast(); });
    render();
    return;
  }
  cancel();
  if (act === "surface") {
    state.surface = el.dataset.surface;
    window.scrollTo(0, 0);
  } else if (act === "tab") {
    state.tab = el.dataset.tab;
    state.view = null;
    state.sheet = null;
    state.locked = false;
  } else if (act === "plus") {
    state.locked = false;
    state.mode = state.tab === "filter" ? "filter" : "style";
    state.tab = state.mode;
    state.view = "create";
    state.phase = "form";
    state.refId = null;
    state.srcId = null;
    state.sheet = null;
  } else if (act === "same" || act === "use") {
    const p = preset(act === "same" ? el.dataset.id : state.presetId);
    state.refId = p.id;
    state.mode = p.engine;
    state.tab = p.engine;
    state.view = "create";
    state.phase = "form";
    state.locked = true;
    state.srcId = null;
    state.sheet = null;
  } else if (act === "open") {
    state.surface = "app";
    state.view = "detail";
    state.presetId = el.dataset.id;
    state.tab = preset(el.dataset.id).engine;
  } else if (act === "close-view") {
    state.view = null;
    state.sheet = null;
    state.locked = false;
  } else if (act === "mode") {
    state.mode = el.dataset.mode;
    state.tab = state.mode;
    if (state.refId && preset(state.refId).engine !== state.mode) state.refId = null;
    if (state.phase === "result") state.phase = "form";
  } else if (act === "sheet") {
    state.sheet = el.dataset.sheet;
  } else if (act === "close-sheet") {
    state.sheet = null;
  } else if (act === "pick-ref") {
    state.refId = el.dataset.id;
    state.mode = preset(el.dataset.id).engine;
    state.tab = state.mode;
    state.sheet = null;
  } else if (act === "pick-src") {
    state.srcId = el.dataset.id;
    state.sheet = null;
  } else if (act === "start") {
    if (!state.refId || !state.srcId) {
      state.toast = state.locked && state.refId ? "先上传自己的照片。" : "先放入参照图和自己的原片。";
      arm(1800, () => { clearToast(); });
    } else {
      state.sheet = null;
      state.phase = "parsing";
      const refId = state.refId;
      const srcId = state.srcId;
      const mode = state.mode;
      arm(1700, () => {
        state.phase = "result";
        state.showRaw = false;
        state.last = { refId, srcId, mode };
        render();
      });
    }
  } else if (act === "back-form") {
    state.phase = "form";
  } else if (act === "raw") {
    state.showRaw = el.dataset.raw === "1";
  } else if (act === "copy") {
    const link = "https://yinxiang.app/r/" + state.refId;
    if (navigator.clipboard) navigator.clipboard.writeText(link).catch(() => {});
    state.toast = "配方链接已复制（演示）：" + link;
    arm(2200, () => { clearToast(); });
  } else if (act === "save") {
    state.toast = state.member ? "已保存到相册（演示）。" : "已保存。免费档会带印相角标，会员去掉。";
    arm(2000, () => { clearToast(); });
  } else if (act === "score-pick") {
    state.scoreId = el.dataset.id;
    state.scoreBack = "board";
    state.scorePhase = "parsing";
    const id = state.scoreId;
    arm(1400, () => { state.scorePhase = "done"; state.scoreId = id; render(); });
  } else if (act === "score-reset" || act === "score-home") {
    state.scorePhase = "board";
  } else if (act === "score-new") {
    state.scorePhase = "pick";
  } else if (act === "score-tips") {
    state.scorePhase = "tips";
  } else if (act === "score-open") {
    state.scoreId = el.dataset.id;
    state.scoreBack = el.dataset.from || "board";
    state.scorePhase = "done";
  } else if (act === "score-card") {
    if (railDragged) return;
    const rail = el.closest(".v-rail");
    if (rail && railCenter(rail) !== el) {
      railTo(rail, el, true);
      return;
    }
    state.scoreId = el.dataset.id;
    state.scoreBack = "board";
    state.scorePhase = "done";
  } else if (act === "score-all") {
    state.scorePhase = "all";
  } else if (act === "score-back") {
    state.scorePhase = state.scoreBack || "board";
  } else if (act === "share-score") {
    state.toast = "评分卡已按 3:4 准备好（演示），不评脸。";
    arm(2000, () => { clearToast(); });
  } else if (act === "open-pay") {
    state.view = "pay";
  } else if (act === "plan") {
    state.plan = el.dataset.plan;
  } else if (act === "subscribe") {
    state.member = true;
    state.toast = "演示已记下" + (state.plan === "month" ? "连续包月 16 元" : "连续包年 128 元") + "，没有扣款。";
    state.view = null;
    state.tab = "me";
    state.surface = "app";
    arm(2200, () => { clearToast(); });
  } else if (act === "try") {
    state.surface = "app";
    state.refId = el.dataset.id;
    state.srcId = el.dataset.src;
    state.mode = preset(el.dataset.id).engine;
    state.tab = state.mode;
    state.view = "create";
    state.phase = "form";
    state.locked = true;
    window.scrollTo(0, 0);
  } else if (act === "goto-score") {
    state.surface = "app";
    state.tab = "score";
    state.view = null;
    state.scorePhase = "board";
    window.scrollTo(0, 0);
  } else if (act === "reopen") {
    state.mode = state.last.mode;
    state.tab = state.mode;
    state.view = "create";
    state.phase = "result";
    state.locked = true;
    state.refId = state.last.refId;
    state.srcId = state.last.srcId;
  } else if (act === "score-front") {
    state.scoreId = el.dataset.id;
  } else if (act === "avatar-roll") {
    state.avatar = Math.floor(Math.random() * 1e6);
    try { localStorage.setItem("yx-avatar", String(state.avatar)); } catch (err) {}
  } else if (act === "cat") {
    state.cat = el.dataset.cat;
  } else if (act === "fcat") {
    state.fcat = el.dataset.cat;
  } else if (act === "drop-hint") {
    state.toast = "演示里直接点下面的照片。正式版这里会打开相册。";
    arm(1800, () => { clearToast(); });
  } else if (act === "folder") {
    const mode = el.dataset.mode;
    if (mode === "score") {
      state.tab = "score";
      state.view = null;
      state.scorePhase = "board";
    } else if (state.last && state.last.mode === mode) {
      state.mode = mode;
      state.tab = mode;
      state.view = "create";
      state.phase = "result";
      state.locked = true;
      state.refId = state.last.refId;
      state.srcId = state.last.srcId;
    } else {
      state.tab = mode;
      state.view = null;
    }
  } else if (act === "reopen-score") {
    state.tab = "score";
    state.scorePhase = "done";
    state.view = null;
  }
  render();
});

document.body.addEventListener("input", (e) => {
  if (e.target.id !== "strength") return;
  state.strength = Number(e.target.value);
  document.documentElement.style.setProperty("--strength", String(state.strength));
  const label = e.target.previousElementSibling;
  if (label && label.querySelector) {
    const spans = e.target.parentElement.querySelectorAll("header span");
    if (spans[1]) spans[1].textContent = String(state.strength);
  }
});

window.__yx = { state, render };
render();
